[package]
edition = "2021"
name = "rp2040-pio-console"
version = "0.5.0"
license = "MIT OR Apache-2.0"
rust-version = "1.77"

[dependencies]
cortex-m = { version = "0.7.2" }
cortex-m-rt = "0.7"
embedded-hal = {version = "1.0.0"}
panic-halt = "1.0.0"
rp2040-hal = { version = "0.10", features = [
    "critical-section-impl",
    "rt",
    "defmt",
] }
rp2040-boot2 = "0.3.0"


critical-section = { version = "1.2.0"}

rp-pio-serial = { path = "../rp-pio-serial", version = "0.1.0" }
# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3


